<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="520" height="420" rx="28" fill="#0d1117"/>
  <circle cx="260" cy="210" r="170" fill="url(#bgGlow)"/>

  <!-- faint perspective floor grid -->
  <g stroke="#2a3040" stroke-width="1" opacity="0.5">
    <line x1="60" y1="360" x2="460" y2="360"/>
    <line x1="90" y1="335" x2="430" y2="335"/>
    <line x1="120" y1="310" x2="400" y2="310"/>
    <line x1="150" y1="285" x2="370" y2="285"/>
    <line x1="260" y1="285" x2="260" y2="360"/>
    <line x1="200" y1="290" x2="150" y2="360"/>
    <line x1="320" y1="290" x2="370" y2="360"/>
    <line x1="230" y1="288" x2="200" y2="360"/>
    <line x1="290" y1="288" x2="320" y2="360"/>
  </g>

  <!-- orbit rings -->
  <g transform="translate(260,190)">
    <circle r="70" fill="none" stroke="url(#ringGrad1)" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="102" fill="none" stroke="url(#ringGrad2)" stroke-width="1.2" stroke-dasharray="2 10" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle r="130" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="1 14" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>

    <!-- glowing core -->
    <circle r="34" fill="url(#coreGlow)" filter="url(#blur1)">
      <animate attributeName="r" values="30;38;30" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting particles -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="70" cy="0" r="4" fill="#22D3EE" filter="url(#blur2)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="13s" repeatCount="indefinite"/>
      <circle cx="102" cy="0" r="3.2" fill="#EC4899" filter="url(#blur2)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="16s" repeatCount="indefinite"/>
      <circle cx="130" cy="0" r="2.6" fill="#7C3AED" filter="url(#blur2)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="11s" repeatCount="indefinite"/>
      <circle cx="70" cy="0" r="2.4" fill="#a78bfa" filter="url(#blur2)"/>
    </g>
  </g>

  <!-- floating code glyphs -->
  <g font-family="Fira Code, monospace" font-size="15" fill="#22D3EE" opacity="0.55">
    <text x="48" y="70">&lt;/&gt;</text>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4s" repeatCount="indefinite"/>
  </g>
  <g font-family="Fira Code, monospace" font-size="14" fill="#EC4899" opacity="0.5">
    <text x="420" y="90">{ }</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#a78bfa" opacity="0.5">
    <text x="410" y="330">shader.glsl</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#22D3EE" opacity="0.45">
    <text x="45" y="330">k8s --apply</text>
  </g>
</svg>
